# ╔══════════════════════════════════════════════╗
# ║  NEBULA//DRIFT — kitty config (Arch Linux)   ║
# ║  ~/.config/kitty/kitty.conf                  ║
# ╚══════════════════════════════════════════════╝

# ── Font ───────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          11.5

# ── Cursor ─────────────────────────────────────
cursor_shape            beam
cursor_beam_thickness   2
cursor_blink_interval   0.6
cursor_trail            1
cursor_trail_decay      0.1 0.55

# ── Window ─────────────────────────────────────
window_padding_width        16 20
background_opacity          0.92
dynamic_background_opacity  yes
hide_window_decorations     yes
confirm_os_window_close     0
enable_audio_bell           no
scrollback_lines            10000
copy_on_select              yes
draw_minimal_borders        yes
window_border_width         1px

# Faint spiral galaxy watermark in the bottom-right corner of every window
window_logo_path      nebula-drift.png
window_logo_position  bottom-right
window_logo_alpha     0.08
window_logo_scale     28

# ── Tabs ───────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             separator
tab_separator             ""
tab_bar_margin_height     4 0
tab_title_template        " ⋆ {index} {title} "
active_tab_title_template " ⋆ {index} {title.upper()} ⋆ "

# ── NEBULA//DRIFT palette ──────────────
foreground            #e2d6ff
background            #05020e
selection_foreground  #f5eeff
selection_background  #3d1a5c
cursor                #e040fb
cursor_text_color     #05020e
url_color             #3a86ff
url_style             curly

active_border_color   #c850ff
inactive_border_color #2b1645
bell_border_color     #ffd06b

active_tab_foreground   #05020e
active_tab_background   #c850ff
active_tab_font_style   bold
inactive_tab_foreground #8a70b8
inactive_tab_background #120a22
tab_bar_background      #05020e

# black
color0  #120a22
color8  #4a3a6a
# red
color1  #ff4d7d
color9  #ff7aa0
# green
color2  #5cf2b5
color10 #8affcd
# yellow
color3  #ffd06b
color11 #ffe199
# blue
color4  #3a86ff
color12 #7aaeff
# magenta
color5  #c850ff
color13 #e040fb
# cyan
color6  #4de1ff
color14 #8aeeff
# white
color7  #d7c8f5
color15 #f5eeff

# ── Shortcuts ──────────────────────────────────
map ctrl+shift+m      launch --type=tab --tab-title "stardust" cmatrix -b -C magenta
map ctrl+shift+i      launch --type=overlay bash -c "fastfetch; read -rsn1"
map ctrl+shift+enter  launch --cwd=current --location=vsplit
map ctrl+shift+a>up   set_background_opacity +0.05
map ctrl+shift+a>down set_background_opacity -0.05
enabled_layouts splits,stack
