# ╔══════════════════════════════════════════════╗
# ║  RED//OPS — kitty config (Arch Linux)        ║
# ║  ~/.config/kitty/kitty.conf                  ║
# ╚══════════════════════════════════════════════╝

# ── Font ───────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          11.5

# ── Cursor ─────────────────────────────────────
cursor_shape            beam
cursor_beam_thickness   2
cursor_blink_interval   0.6
cursor_trail            1
cursor_trail_decay      0.05 0.25

# ── Window ─────────────────────────────────────
window_padding_width     16 20
background_opacity       0.93
hide_window_decorations  yes
confirm_os_window_close  0
enable_audio_bell        no
scrollback_lines         10000
copy_on_select           yes
draw_minimal_borders     yes
window_border_width      1px

# Faint targeting reticle in the bottom-right corner of every window
window_logo_path      reticle.png
window_logo_position  bottom-right
window_logo_alpha     0.07
window_logo_scale     28

# ── Tabs (HUD style) ───────────────────────────
tab_bar_edge          bottom
tab_bar_style         separator
tab_separator         ""
tab_bar_margin_height 4 0
tab_title_template        " ⟦{index}⟧ {title.upper()} "
active_tab_title_template " ⟦{index}⟧ {title.upper()} ◉ "

# ── RED//OPS palette ───────────────────────────
foreground            #e8d6d6
background            #0a0506
selection_foreground  #0a0506
selection_background  #ff1f3d
cursor                #ff1f3d
cursor_text_color     #0a0506
url_color             #2de2e6
url_style             straight

active_border_color   #ff1f3d
inactive_border_color #3d1419
bell_border_color     #ffb000

active_tab_foreground   #0a0506
active_tab_background   #ff1f3d
active_tab_font_style   bold
inactive_tab_foreground #8a5a60
inactive_tab_background #140a0c
tab_bar_background      #0a0506

# black
color0  #140a0c
color8  #3d1419
# red (main)
color1  #ff1f3d
color9  #ff5c70
# green (success)
color2  #9cff57
color10 #c4ff8f
# amber (warnings, paths)
color3  #ffb000
color11 #ffc94d
# blue
color4  #5b8cff
color12 #8fb0ff
# magenta
color5  #ff3d9a
color13 #ff7ab8
# cyan (info)
color6  #2de2e6
color14 #7ff0f2
# white
color7  #e8d6d6
color15 #fff2f2

# ── Shortcuts ──────────────────────────────────
map ctrl+shift+m      launch --type=tab --tab-title "rain" cmatrix -b -C red
map ctrl+shift+i      launch --type=overlay fastfetch --pipe false
map ctrl+shift+enter  launch --cwd=current --location=vsplit
map ctrl+shift+a>up   set_background_opacity +0.05
map ctrl+shift+a>down set_background_opacity -0.05
enabled_layouts splits,stack
