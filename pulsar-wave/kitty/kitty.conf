# ╔══════════════════════════════════════════════╗
# ║  PULSAR//WAVE — kitty config (Arch Linux)    ║
# ║  ~/.config/kitty/kitty.conf                  ║
# ╚══════════════════════════════════════════════╝

# ── Font ───────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          11.5

# ── Cursor ─────────────────────────────────────
cursor_shape            beam
cursor_beam_thickness   2
cursor_blink_interval   0.6
cursor_trail            1
cursor_trail_decay      0.08 0.4

# ── Window ─────────────────────────────────────
window_padding_width        16 20
background_opacity          0.93
dynamic_background_opacity  yes
hide_window_decorations     yes
confirm_os_window_close     0
enable_audio_bell           no
scrollback_lines            10000
copy_on_select              yes
draw_minimal_borders        yes
window_border_width         1px

# Faint pulsar watermark in the bottom-right corner of every window
window_logo_path      pulsar-wave.png
window_logo_position  bottom-right
window_logo_alpha     0.08
window_logo_scale     28

# ── Tabs ───────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             separator
tab_separator             ""
tab_bar_margin_height     4 0
tab_title_template        " ∙ {index} {title} "
active_tab_title_template " ◉ {index} {title.upper()} "

# ── PULSAR//WAVE palette ───────────────
foreground            #f5e6c8
background            #030611
selection_foreground  #fff6e5
selection_background  #33280a
cursor                #ffb300
cursor_text_color     #030611
url_color             #3de0ff
url_style             curly

active_border_color   #ffb300
inactive_border_color #17203a
bell_border_color     #ffcb4d

active_tab_foreground   #030611
active_tab_background   #ffb300
active_tab_font_style   bold
inactive_tab_foreground #8a8068
inactive_tab_background #0b1222
tab_bar_background      #030611

# black
color0  #0b1222
color8  #2e3a55
# red
color1  #ff5a4d
color9  #ff8577
# green
color2  #9be564
color10 #bdf28f
# yellow
color3  #ffb300
color11 #ffcb4d
# blue
color4  #3a6bff
color12 #7392ff
# magenta
color5  #ff6ad5
color13 #ff96e2
# cyan
color6  #3de0ff
color14 #80ebff
# white
color7  #f0e2c4
color15 #fff6e5

# ── Shortcuts ──────────────────────────────────
map ctrl+shift+m      launch --type=tab --tab-title "photons" cmatrix -b -C yellow
map ctrl+shift+i      launch --type=overlay bash -c "fastfetch; read -rsn1"
map ctrl+shift+enter  launch --cwd=current --location=vsplit
map ctrl+shift+a>up   set_background_opacity +0.05
map ctrl+shift+a>down set_background_opacity -0.05
enabled_layouts splits,stack
