# ╔══════════════════════════════════════════════╗
# ║  INFERNO//SH — kitty config (Arch Linux)     ║
# ║  ~/.config/kitty/kitty.conf                  ║
# ╚══════════════════════════════════════════════╝

# ── Font ───────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          11.5

# ── Cursor ─────────────────────────────────────
cursor_shape            beam
cursor_beam_thickness   2
cursor_blink_interval   0.6
cursor_trail            1
cursor_trail_decay      0.02 0.15

# ── Window ─────────────────────────────────────
window_padding_width        16 20
background_opacity          0.95
dynamic_background_opacity  yes
hide_window_decorations     yes
confirm_os_window_close     0
enable_audio_bell           no
scrollback_lines            10000
copy_on_select              yes
draw_minimal_borders        yes
window_border_width         1px

# Faint flame watermark in the bottom-right corner of every window
window_logo_path      inferno-sh.png
window_logo_position  bottom-right
window_logo_alpha     0.08
window_logo_scale     28

# ── Tabs ───────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             separator
tab_separator             ""
tab_bar_margin_height     4 0
tab_title_template        " ▸ {index} {title} "
active_tab_title_template " ▸ {index} {title.upper()} ◂ "

# ── INFERNO//SH palette ────────────────
foreground            #ffd9b3
background            #070200
selection_foreground  #fff0e0
selection_background  #4a1200
cursor                #ff4500
cursor_text_color     #070200
url_color             #ffb020
url_style             curly

active_border_color   #ff4500
inactive_border_color #2e0d02
bell_border_color     #ffb020

active_tab_foreground   #070200
active_tab_background   #ff4500
active_tab_font_style   bold
inactive_tab_foreground #a8683f
inactive_tab_background #160803
tab_bar_background      #070200

# black
color0  #160803
color8  #4a2010
# red
color1  #ff2a00
color9  #ff5a33
# green
color2  #c2d94c
color10 #d8ea7a
# yellow
color3  #ffb020
color11 #ffc95a
# blue
color4  #5a8cff
color12 #8aaeff
# magenta
color5  #ff4f9a
color13 #ff80b5
# cyan
color6  #48d8c8
color14 #80e8dc
# white
color7  #f0c8a8
color15 #fff0e0

# ── Shortcuts ──────────────────────────────────
map ctrl+shift+m      launch --type=tab --tab-title "cinders" cmatrix -b -C red
map ctrl+shift+i      launch --type=overlay bash -c "fastfetch; read -rsn1"
map ctrl+shift+enter  launch --cwd=current --location=vsplit
map ctrl+shift+a>up   set_background_opacity +0.05
map ctrl+shift+a>down set_background_opacity -0.05
enabled_layouts splits,stack
