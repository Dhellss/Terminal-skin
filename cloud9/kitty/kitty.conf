# ╔══════════════════════════════════════════════╗
# ║  CLOUD//9 — kitty config (Arch Linux)        ║
# ║  ~/.config/kitty/kitty.conf                  ║
# ╚══════════════════════════════════════════════╝

# ── Font ───────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          11.5

# ── Cursor ─────────────────────────────────────
cursor_shape            beam
cursor_beam_thickness   2
cursor_blink_interval   0.6
cursor_trail            1
cursor_trail_decay      0.08 0.45

# ── Window ─────────────────────────────────────
window_padding_width        16 20
background_opacity          0.93
dynamic_background_opacity  yes
hide_window_decorations     yes
confirm_os_window_close     0
enable_audio_bell           no
scrollback_lines            10000
copy_on_select              yes
draw_minimal_borders        yes
window_border_width         1px

# Faint cloud watermark in the bottom-right corner of every window
window_logo_path      cloud9.png
window_logo_position  bottom-right
window_logo_alpha     0.08
window_logo_scale     28

# ── Tabs ───────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             separator
tab_separator             ""
tab_bar_margin_height     4 0
tab_title_template        " ◦ {index} {title} "
active_tab_title_template " ◦ {index} {title.upper()} ◦ "

# ── CLOUD//9 palette ───────────────────
foreground            #e3f1ff
background            #080d14
selection_foreground  #f4faff
selection_background  #1d3a5a
cursor                #60b8ff
cursor_text_color     #080d14
url_color             #ffb3d1
url_style             curly

active_border_color   #60b8ff
inactive_border_color #15263a
bell_border_color     #ffd98a

active_tab_foreground   #080d14
active_tab_background   #60b8ff
active_tab_font_style   bold
inactive_tab_foreground #7590ad
inactive_tab_background #111a26
tab_bar_background      #080d14

# black
color0  #111a26
color8  #34475e
# red
color1  #ff7a90
color9  #ffa3b3
# green
color2  #7ee0b0
color10 #a6edc9
# yellow
color3  #ffd98a
color11 #ffe7b0
# blue
color4  #60b8ff
color12 #94d0ff
# magenta
color5  #ffb3d1
color13 #ffd1e3
# cyan
color6  #7ee8ff
color14 #b0f1ff
# white
color7  #d6ebff
color15 #f4faff

# ── Shortcuts ──────────────────────────────────
map ctrl+shift+m      launch --type=tab --tab-title "drizzle" cmatrix -b -C blue
map ctrl+shift+i      launch --type=overlay bash -c "fastfetch; read -rsn1"
map ctrl+shift+enter  launch --cwd=current --location=vsplit
map ctrl+shift+a>up   set_background_opacity +0.05
map ctrl+shift+a>down set_background_opacity -0.05
enabled_layouts splits,stack
