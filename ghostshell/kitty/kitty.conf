# ╔══════════════════════════════════════════════╗
# ║  GHOST//SHELL — kitty config (Arch Linux)    ║
# ║  ~/.config/kitty/kitty.conf                  ║
# ╚══════════════════════════════════════════════╝

# ── Font ───────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          11.5
disable_ligatures  never

# ── Cursor (blinking block + glowing trail) ────
cursor_shape            block
cursor_blink_interval   0.5
cursor_trail            3
cursor_trail_decay      0.1 0.4

# ── Window ─────────────────────────────────────
window_padding_width     14
background_opacity       0.90
dynamic_background_opacity yes
hide_window_decorations  yes
confirm_os_window_close  0
enable_audio_bell        no
scrollback_lines         10000
copy_on_select           yes

# ── Tabs ───────────────────────────────────────
tab_bar_edge         top
tab_bar_style        powerline
tab_powerline_style  slanted
tab_title_template   " {index}:{title} "

# ── GHOST//SHELL palette ───────────────────────
foreground            #00ff9c
background            #050a07
selection_foreground  #050a07
selection_background  #00ff9c
cursor                #00ff9c
cursor_text_color     #050a07
url_color             #00e5ff
url_style             curly

active_border_color   #00ff9c
inactive_border_color #0f3d26
bell_border_color     #ff2e63

active_tab_foreground   #050a07
active_tab_background   #00ff9c
active_tab_font_style   bold
inactive_tab_foreground #00ff9c
inactive_tab_background #0b1a12
tab_bar_background      #050a07

# black
color0  #0b1a12
color8  #1f4d36
# red (errors)
color1  #ff2e63
color9  #ff5c85
# green (main)
color2  #00ff9c
color10 #5cffbe
# yellow
color3  #e6ff00
color11 #f2ff66
# blue
color4  #00b3ff
color12 #5cd1ff
# magenta
color5  #b026ff
color13 #cf73ff
# cyan
color6  #00e5ff
color14 #66f0ff
# white
color7  #b8ffd9
color15 #e8fff3

# ── Shortcuts ──────────────────────────────────
# Ctrl+Shift+M  → matrix rain in a new tab
map ctrl+shift+m launch --type=tab --tab-title "matrix" cmatrix -b -C green
# Ctrl+Shift+A then up/down → change transparency
map ctrl+shift+a>up   set_background_opacity +0.05
map ctrl+shift+a>down set_background_opacity -0.05
