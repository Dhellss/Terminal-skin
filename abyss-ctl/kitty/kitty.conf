# ╔══════════════════════════════════════════════╗
# ║  ABYSS//CTL — kitty config (Arch Linux)      ║
# ║  ~/.config/kitty/kitty.conf                  ║
# ╚══════════════════════════════════════════════╝

# ── Font ───────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          11.5

# ── Cursor ─────────────────────────────────────
cursor_shape            beam
cursor_beam_thickness   2
cursor_blink_interval   0.6
cursor_trail            1
cursor_trail_decay      0.02 0.12

# ── Window ─────────────────────────────────────
window_padding_width        16 20
background_opacity          0.96
dynamic_background_opacity  yes
hide_window_decorations     yes
confirm_os_window_close     0
enable_audio_bell           no
scrollback_lines            10000
copy_on_select              yes
draw_minimal_borders        yes
window_border_width         1px

# Faint inverted pentagram watermark in the bottom-right corner of every window
window_logo_path      abyss-ctl.png
window_logo_position  bottom-right
window_logo_alpha     0.08
window_logo_scale     28

# ── Tabs ───────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             separator
tab_separator             ""
tab_bar_margin_height     4 0
tab_title_template        " ‡ {index} {title} "
active_tab_title_template " ‡ {index} {title.upper()} ‡ "

# ── ABYSS//CTL palette ─────────────────
foreground            #e8cccc
background            #030000
selection_foreground  #f5e8e8
selection_background  #3a0505
cursor                #e01010
cursor_text_color     #030000
url_color             #f0e6d8
url_style             curly

active_border_color   #e01010
inactive_border_color #2a0606
bell_border_color     #d9a441

active_tab_foreground   #030000
active_tab_background   #e01010
active_tab_font_style   bold
inactive_tab_foreground #8f5a5a
inactive_tab_background #120404
tab_bar_background      #030000

# black
color0  #120404
color8  #3d1414
# red
color1  #e01010
color9  #ff4040
# green
color2  #6fbf3f
color10 #95d66c
# yellow
color3  #d9a441
color11 #e8c070
# blue
color4  #6a5acd
color12 #9488e0
# magenta
color5  #b0306a
color13 #d05a8c
# cyan
color6  #5f9ea0
color14 #8cc0c0
# white
color7  #d8c0c0
color15 #f5e8e8

# ── Shortcuts ──────────────────────────────────
map ctrl+shift+m      launch --type=tab --tab-title "bleed" cmatrix -b -C red
map ctrl+shift+i      launch --type=overlay bash -c "fastfetch; read -rsn1"
map ctrl+shift+enter  launch --cwd=current --location=vsplit
map ctrl+shift+a>up   set_background_opacity +0.05
map ctrl+shift+a>down set_background_opacity -0.05
enabled_layouts splits,stack
