"$schema" = 'https://starship.rs/config-schema.json'

# ASCEND//SH — lavender twilight / dawn gold prompt
#
#  󱊽 ASCEND dhell@archbox · ~/projects/terminal-skin ·  main ⋰⋰⋰⋰⋰⋰ · MEM 34% · IP 192.168.1.24 · 22:35
#  ╰─▲❯

add_newline = true
continuation_prompt = '[∙∙ ](#8a7aab)'

format = """
[](fg:#c880ff)[󱊽 ASCEND](bold fg:#0a0810 bg:#c880ff)[](fg:#c880ff) \
$username$hostname$directory$git_branch$git_status\
$python$nodejs$rust$golang$java$c$docker_context\
$fill\
$cmd_duration$memory_usage$localip$battery$time
[╰─](#514569)$character"""

[fill]
symbol = '⋰'
style = '#231a33'

[username]
show_always = true
style_user = 'bold #c880ff'
style_root = 'bold blink #ff7096'
format = '[$user]($style)'

[hostname]
ssh_only = false
ssh_symbol = ' 󰌗'
style = '#ece4ff'
format = '[@](#8a7aab)[$hostname$ssh_symbol ]($style)'

[directory]
style = 'bold #f2c8ff'
read_only = ' 󰌾'
read_only_style = '#ff7096'
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'
format = '[· ](#8a7aab)[$path]($style)[$read_only]($read_only_style)[ ](#8a7aab)'

[git_branch]
symbol = ' '
style = '#ffd27a'
format = '[· ](#8a7aab)[$symbol$branch ]($style)'

[git_status]
style = '#ff7096'
format = '([⟨$all_status$ahead_behind⟩ ]($style))'

[character]
success_symbol = '[▲](bold #ffd27a)[❯](bold #c880ff)'
error_symbol = '[✗](bold #ff7096)[❯](bold #c880ff)'
vimcmd_symbol = '[❮](bold #ffd27a)'

# ── readouts (right side of the top line) ──
[cmd_duration]
min_time = 2000
style = '#ffd27a'
format = ' [󰔟 $duration]($style)'

[memory_usage]
disabled = false
threshold = -1
style = '#ece4ff'
format = '[ · ](#514569)[MEM $ram_pct]($style)'

[localip]
disabled = false
ssh_only = false
style = '#ffd27a'
format = '[ · ](#514569)[IP $localipv4]($style)'

[battery]
full_symbol = '󰁹 '
charging_symbol = '󰂄 '
discharging_symbol = '󰂃 '
format = '[ · ](#514569)[$symbol$percentage]($style)'

[[battery.display]]
threshold = 20
style = 'bold #ff7096'

[[battery.display]]
threshold = 100
style = '#8ee6b0'

[time]
disabled = false
time_format = '%H:%M'
style = 'bold #c880ff'
format = '[ · ](#514569)[$time]($style)'

# ── languages (only inside project folders) ──
[python]
symbol = '󰌠 '
style = '#ffd27a'
format = '[$symbol$version(\($virtualenv\))]($style) '

[nodejs]
symbol = '󰎙 '
style = '#8ee6b0'
format = '[$symbol$version]($style) '

[rust]
symbol = '󱘗 '
style = '#ff7096'
format = '[$symbol$version]($style) '

[golang]
symbol = '󰟓 '
style = '#ffd27a'
format = '[$symbol$version]($style) '

[java]
symbol = '󰬷 '
style = '#ff7096'
format = '[$symbol$version]($style) '

[c]
symbol = '󰙱 '
style = '#ffd27a'
format = '[$symbol$version]($style) '

[docker_context]
symbol = '󰡨 '
style = '#ffd27a'
format = '[$symbol$context]($style) '
