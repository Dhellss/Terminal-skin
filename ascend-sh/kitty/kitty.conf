# ╔══════════════════════════════════════════════╗
# ║  ASCEND//SH — kitty config (Arch Linux)      ║
# ║  ~/.config/kitty/kitty.conf                  ║
# ╚══════════════════════════════════════════════╝

# ── Font ───────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          11.5

# ── Cursor ─────────────────────────────────────
cursor_shape            beam
cursor_beam_thickness   2
cursor_blink_interval   0.6
cursor_trail            1
cursor_trail_decay      0.06 0.35

# ── Window ─────────────────────────────────────
window_padding_width        16 20
background_opacity          0.93
dynamic_background_opacity  yes
hide_window_decorations     yes
confirm_os_window_close     0
enable_audio_bell           no
scrollback_lines            10000
copy_on_select              yes
draw_minimal_borders        yes
window_border_width         1px

# Faint stairway to the light watermark in the bottom-right corner of every window
window_logo_path      ascend-sh.png
window_logo_position  bottom-right
window_logo_alpha     0.08
window_logo_scale     28

# ── Tabs ───────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             separator
tab_separator             ""
tab_bar_margin_height     4 0
tab_title_template        " ▴ {index} {title} "
active_tab_title_template " ▲ {index} {title.upper()} "

# ── ASCEND//SH palette ─────────────────
foreground            #ece4ff
background            #0a0810
selection_foreground  #faf6ff
selection_background  #33264f
cursor                #c880ff
cursor_text_color     #0a0810
url_color             #ffd27a
url_style             curly

active_border_color   #c880ff
inactive_border_color #231a33
bell_border_color     #ffd27a

active_tab_foreground   #0a0810
active_tab_background   #c880ff
active_tab_font_style   bold
inactive_tab_foreground #8a7aab
inactive_tab_background #151122
tab_bar_background      #0a0810

# black
color0  #151122
color8  #3b3352
# red
color1  #ff7096
color9  #ff9ab4
# green
color2  #8ee6b0
color10 #b2f0ca
# yellow
color3  #ffd27a
color11 #ffe2a6
# blue
color4  #7c9cff
color12 #a6bcff
# magenta
color5  #c880ff
color13 #f2c8ff
# cyan
color6  #8fd8ff
color14 #b8e7ff
# white
color7  #e2d8f5
color15 #faf6ff

# ── Shortcuts ──────────────────────────────────
map ctrl+shift+m      launch --type=tab --tab-title "rise" cmatrix -b -C magenta
map ctrl+shift+i      launch --type=overlay bash -c "fastfetch; read -rsn1"
map ctrl+shift+enter  launch --cwd=current --location=vsplit
map ctrl+shift+a>up   set_background_opacity +0.05
map ctrl+shift+a>down set_background_opacity -0.05
enabled_layouts splits,stack
