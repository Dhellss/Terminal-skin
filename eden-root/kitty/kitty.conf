# ╔══════════════════════════════════════════════╗
# ║  EDEN//ROOT — kitty config (Arch Linux)      ║
# ║  ~/.config/kitty/kitty.conf                  ║
# ╚══════════════════════════════════════════════╝

# ── Font ───────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          11.5

# ── Cursor ─────────────────────────────────────
cursor_shape            beam
cursor_beam_thickness   2
cursor_blink_interval   0.6
cursor_trail            1
cursor_trail_decay      0.05 0.3

# ── Window ─────────────────────────────────────
window_padding_width        16 20
background_opacity          0.94
dynamic_background_opacity  yes
hide_window_decorations     yes
confirm_os_window_close     0
enable_audio_bell           no
scrollback_lines            10000
copy_on_select              yes
draw_minimal_borders        yes
window_border_width         1px

# Faint tree of life watermark in the bottom-right corner of every window
window_logo_path      eden-root.png
window_logo_position  bottom-right
window_logo_alpha     0.08
window_logo_scale     28

# ── Tabs ───────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             separator
tab_separator             ""
tab_bar_margin_height     4 0
tab_title_template        " • {index} {title} "
active_tab_title_template " • {index} {title.upper()} "

# ── EDEN//ROOT palette ─────────────────
foreground            #e2f2e4
background            #060e0a
selection_foreground  #fbfff0
selection_background  #1a4030
cursor                #50d890
cursor_text_color     #060e0a
url_color             #e8d27a
url_style             curly

active_border_color   #50d890
inactive_border_color #12291c
bell_border_color     #e8d27a

active_tab_foreground   #060e0a
active_tab_background   #50d890
active_tab_font_style   bold
inactive_tab_foreground #72a084
inactive_tab_background #0f1a14
tab_bar_background      #060e0a

# black
color0  #0f1a14
color8  #2f4a3a
# red
color1  #ff6b6b
color9  #ff9494
# green
color2  #50d890
color10 #85e8b2
# yellow
color3  #e8d27a
color11 #f2e3a3
# blue
color4  #5aa9e6
color12 #8cc4ee
# magenta
color5  #d98ad9
color13 #e8b0e8
# cyan
color6  #5fd8c8
color14 #92e8dc
# white
color7  #e8f0d0
color15 #fbfff0

# ── Shortcuts ──────────────────────────────────
map ctrl+shift+m      launch --type=tab --tab-title "vines" cmatrix -b -C green
map ctrl+shift+i      launch --type=overlay bash -c "fastfetch; read -rsn1"
map ctrl+shift+enter  launch --cwd=current --location=vsplit
map ctrl+shift+a>up   set_background_opacity +0.05
map ctrl+shift+a>down set_background_opacity -0.05
enabled_layouts splits,stack
