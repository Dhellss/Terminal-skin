"$schema" = 'https://starship.rs/config-schema.json'

# EDEN//ROOT — garden mint / ivory / fruit red prompt
#
#  󰹦 EDEN dhell@archbox · ~/projects/terminal-skin ·  main ┄┄┄┄┄┄ · MEM 34% · IP 192.168.1.24 · 22:35
#  ╰─•❯

add_newline = true
continuation_prompt = '[∙∙ ](#72a084)'

format = """
[](fg:#50d890)[󰹦 EDEN](bold fg:#060e0a bg:#50d890)[](fg:#50d890) \
$username$hostname$directory$git_branch$git_status\
$python$nodejs$rust$golang$java$c$docker_context\
$fill\
$cmd_duration$memory_usage$localip$battery$time
[╰─](#3d5f4b)$character"""

[fill]
symbol = '┄'
style = '#12291c'

[username]
show_always = true
style_user = 'bold #50d890'
style_root = 'bold blink #ff6b6b'
format = '[$user]($style)'

[hostname]
ssh_only = false
ssh_symbol = ' 󰌗'
style = '#e2f2e4'
format = '[@](#72a084)[$hostname$ssh_symbol ]($style)'

[directory]
style = 'bold #e8f0d0'
read_only = ' 󰌾'
read_only_style = '#ff6b6b'
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'
format = '[· ](#72a084)[$path]($style)[$read_only]($read_only_style)[ ](#72a084)'

[git_branch]
symbol = ' '
style = '#e8d27a'
format = '[· ](#72a084)[$symbol$branch ]($style)'

[git_status]
style = '#ff6b6b'
format = '([⟨$all_status$ahead_behind⟩ ]($style))'

[character]
success_symbol = '[•](bold #ff6b6b)[❯](bold #50d890)'
error_symbol = '[✗](bold #ff6b6b)[❯](bold #e8d27a)'
vimcmd_symbol = '[❮](bold #e8d27a)'

# ── readouts (right side of the top line) ──
[cmd_duration]
min_time = 2000
style = '#e8d27a'
format = ' [󰔟 $duration]($style)'

[memory_usage]
disabled = false
threshold = -1
style = '#e2f2e4'
format = '[ · ](#3d5f4b)[MEM $ram_pct]($style)'

[localip]
disabled = false
ssh_only = false
style = '#e8d27a'
format = '[ · ](#3d5f4b)[IP $localipv4]($style)'

[battery]
full_symbol = '󰁹 '
charging_symbol = '󰂄 '
discharging_symbol = '󰂃 '
format = '[ · ](#3d5f4b)[$symbol$percentage]($style)'

[[battery.display]]
threshold = 20
style = 'bold #ff6b6b'

[[battery.display]]
threshold = 100
style = '#50d890'

[time]
disabled = false
time_format = '%H:%M'
style = 'bold #50d890'
format = '[ · ](#3d5f4b)[$time]($style)'

# ── languages (only inside project folders) ──
[python]
symbol = '󰌠 '
style = '#e8d27a'
format = '[$symbol$version(\($virtualenv\))]($style) '

[nodejs]
symbol = '󰎙 '
style = '#50d890'
format = '[$symbol$version]($style) '

[rust]
symbol = '󱘗 '
style = '#ff6b6b'
format = '[$symbol$version]($style) '

[golang]
symbol = '󰟓 '
style = '#e8d27a'
format = '[$symbol$version]($style) '

[java]
symbol = '󰬷 '
style = '#ff6b6b'
format = '[$symbol$version]($style) '

[c]
symbol = '󰙱 '
style = '#e8d27a'
format = '[$symbol$version]($style) '

[docker_context]
symbol = '󰡨 '
style = '#e8d27a'
format = '[$symbol$context]($style) '
