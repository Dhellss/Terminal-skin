# ╔══════════════════════════════════════════════╗
# ║  SERAPH//OS — kitty config (Arch Linux)      ║
# ║  ~/.config/kitty/kitty.conf                  ║
# ╚══════════════════════════════════════════════╝

# ── Font ───────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          11.5

# ── Cursor ─────────────────────────────────────
cursor_shape            beam
cursor_beam_thickness   2
cursor_blink_interval   0.6
cursor_trail            1
cursor_trail_decay      0.06 0.3

# ── Window ─────────────────────────────────────
window_padding_width        16 20
background_opacity          0.94
dynamic_background_opacity  yes
hide_window_decorations     yes
confirm_os_window_close     0
enable_audio_bell           no
scrollback_lines            10000
copy_on_select              yes
draw_minimal_borders        yes
window_border_width         1px

# Faint six-winged seraph watermark in the bottom-right corner of every window
window_logo_path      seraph-os.png
window_logo_position  bottom-right
window_logo_alpha     0.08
window_logo_scale     28

# ── Tabs ───────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             separator
tab_separator             ""
tab_bar_margin_height     4 0
tab_title_template        " † {index} {title} "
active_tab_title_template " † {index} {title.upper()} † "

# ── SERAPH//OS palette ─────────────────
foreground            #ece4d0
background            #0c0d12
selection_foreground  #fffaf0
selection_background  #3a3218
cursor                #d8b13a
cursor_text_color     #0c0d12
url_color             #6f8fd8
url_style             curly

active_border_color   #d8b13a
inactive_border_color #2a2616
bell_border_color     #f0cc5a

active_tab_foreground   #0c0d12
active_tab_background   #d8b13a
active_tab_font_style   bold
inactive_tab_foreground #8f876d
inactive_tab_background #16171f
tab_bar_background      #0c0d12

# black
color0  #16171f
color8  #3a3b48
# red
color1  #e8707a
color9  #f29aa1
# green
color2  #8fd694
color10 #b3e6b6
# yellow
color3  #d8b13a
color11 #f0cc5a
# blue
color4  #6f8fd8
color12 #9ab0ea
# magenta
color5  #c49be8
color13 #dbbdf5
# cyan
color6  #7fd1d8
color14 #a8e3e8
# white
color7  #e6dfcc
color15 #fffaf0

# ── Shortcuts ──────────────────────────────────
map ctrl+shift+m      launch --type=tab --tab-title "embers" cmatrix -b -C yellow
map ctrl+shift+i      launch --type=overlay bash -c "fastfetch; read -rsn1"
map ctrl+shift+enter  launch --cwd=current --location=vsplit
map ctrl+shift+a>up   set_background_opacity +0.05
map ctrl+shift+a>down set_background_opacity -0.05
enabled_layouts splits,stack
