# ╔══════════════════════════════════════════════╗
# ║  HALO//CTL — kitty config (Arch Linux)       ║
# ║  ~/.config/kitty/kitty.conf                  ║
# ╚══════════════════════════════════════════════╝

# ── Font ───────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          11.5

# ── Cursor ─────────────────────────────────────
cursor_shape            beam
cursor_beam_thickness   2
cursor_blink_interval   0.6
cursor_trail            1
cursor_trail_decay      0.05 0.25

# ── Window ─────────────────────────────────────
window_padding_width        16 20
background_opacity          0.95
dynamic_background_opacity  yes
hide_window_decorations     yes
confirm_os_window_close     0
enable_audio_bell           no
scrollback_lines            10000
copy_on_select              yes
draw_minimal_borders        yes
window_border_width         1px

# Faint halo watermark in the bottom-right corner of every window
window_logo_path      halo-ctl.png
window_logo_position  bottom-right
window_logo_alpha     0.08
window_logo_scale     28

# ── Tabs ───────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             separator
tab_separator             ""
tab_bar_margin_height     4 0
tab_title_template        " ○ {index} {title} "
active_tab_title_template " ◎ {index} {title.upper()} "

# ── HALO//CTL palette ──────────────────
foreground            #eef6ff
background            #080b10
selection_foreground  #ffffff
selection_background  #2a3646
cursor                #e8f4ff
cursor_text_color     #080b10
url_color             #f5d77a
url_style             curly

active_border_color   #e8f4ff
inactive_border_color #1a2430
bell_border_color     #f5d77a

active_tab_foreground   #080b10
active_tab_background   #e8f4ff
active_tab_font_style   bold
inactive_tab_foreground #7d8c9c
inactive_tab_background #121820
tab_bar_background      #080b10

# black
color0  #121820
color8  #364352
# red
color1  #ff7a85
color9  #ffa1a9
# green
color2  #8de0b5
color10 #b3ecd0
# yellow
color3  #f5d77a
color11 #f9e6a8
# blue
color4  #8ab4f8
color12 #b0ccfa
# magenta
color5  #c8a8f0
color13 #ddc8f6
# cyan
color6  #a0c8e0
color14 #c6e0ee
# white
color7  #dfe8f2
color15 #ffffff

# ── Shortcuts ──────────────────────────────────
map ctrl+shift+m      launch --type=tab --tab-title "radiance" cmatrix -b -C white
map ctrl+shift+i      launch --type=overlay bash -c "fastfetch; read -rsn1"
map ctrl+shift+enter  launch --cwd=current --location=vsplit
map ctrl+shift+a>up   set_background_opacity +0.05
map ctrl+shift+a>down set_background_opacity -0.05
enabled_layouts splits,stack
