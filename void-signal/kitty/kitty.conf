# ╔══════════════════════════════════════════════╗
# ║  VOID//SIGNAL — kitty config (Arch Linux)    ║
# ║  ~/.config/kitty/kitty.conf                  ║
# ╚══════════════════════════════════════════════╝

# ── Font ───────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          11.5

# ── Cursor ─────────────────────────────────────
cursor_shape            beam
cursor_beam_thickness   2
cursor_blink_interval   0.6
cursor_trail            1
cursor_trail_decay      0.05 0.3

# ── Window ─────────────────────────────────────
window_padding_width        16 20
background_opacity          0.94
dynamic_background_opacity  yes
hide_window_decorations     yes
confirm_os_window_close     0
enable_audio_bell           no
scrollback_lines            10000
copy_on_select              yes
draw_minimal_borders        yes
window_border_width         1px

# Faint black hole + signal watermark in the bottom-right corner of every window
window_logo_path      void-signal.png
window_logo_position  bottom-right
window_logo_alpha     0.08
window_logo_scale     28

# ── Tabs ───────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             separator
tab_separator             ""
tab_bar_margin_height     4 0
tab_title_template        " ◇ {index} {title} "
active_tab_title_template " ◈ {index} {title.upper()} "

# ── VOID//SIGNAL palette ───────────────
foreground            #cfeef4
background            #01070d
selection_foreground  #eafcff
selection_background  #0b3a48
cursor                #00f5ff
cursor_text_color     #01070d
url_color             #b0e0e8
url_style             curly

active_border_color   #00f5ff
inactive_border_color #0d2a36
bell_border_color     #ffd166

active_tab_foreground   #01070d
active_tab_background   #00f5ff
active_tab_font_style   bold
inactive_tab_foreground #5f8b99
inactive_tab_background #0a1620
tab_bar_background      #01070d

# black
color0  #0a1620
color8  #2f4a58
# red
color1  #ff5470
color9  #ff8097
# green
color2  #3dffb4
color10 #7dffcc
# yellow
color3  #ffd166
color11 #ffe09a
# blue
color4  #3d7bff
color12 #7aa2ff
# magenta
color5  #b07cff
color13 #cba6ff
# cyan
color6  #00f5ff
color14 #7ffaff
# white
color7  #b0e0e8
color15 #eafcff

# ── Shortcuts ──────────────────────────────────
map ctrl+shift+m      launch --type=tab --tab-title "static" cmatrix -b -C cyan
map ctrl+shift+i      launch --type=overlay bash -c "fastfetch; read -rsn1"
map ctrl+shift+enter  launch --cwd=current --location=vsplit
map ctrl+shift+a>up   set_background_opacity +0.05
map ctrl+shift+a>down set_background_opacity -0.05
enabled_layouts splits,stack
