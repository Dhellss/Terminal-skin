"$schema" = 'https://starship.rs/config-schema.json'

# VOID//SIGNAL — black hole / cyan signal prompt
#
#   󰤉 SIGNAL  dhell@archbox ◇ ~/projects/terminal-skin ◇  main ────── ◇ MEM 34% ◇ IP 192.168.1.24 ◇ 22:35
#  ╰─◈›

add_newline = true
continuation_prompt = '[∙∙ ](#5f8b99)'

format = """
[ 󰤉 SIGNAL ](bold fg:#01070d bg:#00f5ff)[](fg:#00f5ff) \
$username$hostname$directory$git_branch$git_status\
$python$nodejs$rust$golang$java$c$docker_context\
$fill\
$cmd_duration$memory_usage$localip$battery$time
[╰─](#325663)$character"""

[fill]
symbol = '─'
style = '#0d2a36'

[username]
show_always = true
style_user = 'bold #00f5ff'
style_root = 'bold blink #ff5470'
format = '[$user]($style)'

[hostname]
ssh_only = false
ssh_symbol = ' 󰌗'
style = '#cfeef4'
format = '[@](#5f8b99)[$hostname$ssh_symbol ]($style)'

[directory]
style = 'bold #b0e0e8'
read_only = ' 󰌾'
read_only_style = '#ff5470'
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'
format = '[◇ ](#5f8b99)[$path]($style)[$read_only]($read_only_style)[ ](#5f8b99)'

[git_branch]
symbol = ' '
style = '#7c6cff'
format = '[◇ ](#5f8b99)[$symbol$branch ]($style)'

[git_status]
style = '#ff5470'
format = '([⟦$all_status$ahead_behind⟧ ]($style))'

[character]
success_symbol = '[◈](bold #00f5ff)[›](bold #b0e0e8)'
error_symbol = '[✗](bold #ff5470)[›](bold #b0e0e8)'
vimcmd_symbol = '[❮](bold #7c6cff)'

# ── readouts (right side of the top line) ──
[cmd_duration]
min_time = 2000
style = '#ffd166'
format = ' [󰔟 $duration]($style)'

[memory_usage]
disabled = false
threshold = -1
style = '#cfeef4'
format = '[ ◇ ](#325663)[MEM $ram_pct]($style)'

[localip]
disabled = false
ssh_only = false
style = '#b0e0e8'
format = '[ ◇ ](#325663)[IP $localipv4]($style)'

[battery]
full_symbol = '󰁹 '
charging_symbol = '󰂄 '
discharging_symbol = '󰂃 '
format = '[ ◇ ](#325663)[$symbol$percentage]($style)'

[[battery.display]]
threshold = 20
style = 'bold #ff5470'

[[battery.display]]
threshold = 100
style = '#3dffb4'

[time]
disabled = false
time_format = '%H:%M'
style = 'bold #00f5ff'
format = '[ ◇ ](#325663)[$time]($style)'

# ── languages (only inside project folders) ──
[python]
symbol = '󰌠 '
style = '#ffd166'
format = '[$symbol$version(\($virtualenv\))]($style) '

[nodejs]
symbol = '󰎙 '
style = '#3dffb4'
format = '[$symbol$version]($style) '

[rust]
symbol = '󱘗 '
style = '#ff5470'
format = '[$symbol$version]($style) '

[golang]
symbol = '󰟓 '
style = '#b0e0e8'
format = '[$symbol$version]($style) '

[java]
symbol = '󰬷 '
style = '#ff5470'
format = '[$symbol$version]($style) '

[c]
symbol = '󰙱 '
style = '#b0e0e8'
format = '[$symbol$version]($style) '

[docker_context]
symbol = '󰡨 '
style = '#b0e0e8'
format = '[$symbol$context]($style) '
